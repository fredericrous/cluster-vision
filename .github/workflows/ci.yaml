name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Hosted runners for everything that does not need the cluster (2026-09-21).
# 90 days of ARC history: p90 queue wait 4-5 min on jobs whose p50 is 2-4 min,
# 48-minute outliers on runner-pool incidents. ubuntu-latest picks up in
# seconds with 4 vCPU; the public repo pays nothing for it. The migration
# check, the one job that needed the cluster, is now pull-based: see
# `pr-image` at the bottom.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      mcp: ${{ steps.filter.outputs.mcp }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'internal/store/migrations/**'
              - 'internal/store/db.go'
            # internal/diagram: mcp/server.test.ts checks the MCP diagram
            # enum against the IDs the Go generators emit.
            mcp:
              - 'mcp/**'
              - 'internal/diagram/**'
              - '.github/workflows/ci.yaml'
            # What the runtime image is made of, beyond the Go and web code the
            # other jobs already build.
            image:
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'go.mod'
              - '.github/workflows/ci.yaml'

  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The linter version lives in the Makefile and nowhere else, so `make
      # lint` on a workstation and this step run the same binary. The action
      # is kept rather than calling `make lint` directly because
      # only-new-issues below is the action's doing — it diffs the push/PR and
      # passes --new-from-patch/--new-from-merge-base, which a plain
      # `golangci-lint run` cannot reproduce — and because it caches.
      - name: Resolve golangci-lint version
        id: golangci
        run: |
          version=$(awk '/^GOLANGCI_LINT_VERSION[[:space:]]*\?=/{print $NF}' Makefile)
          [ -n "$version" ] || { echo "::error::GOLANGCI_LINT_VERSION not found in Makefile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          only-new-issues: true

      - name: Go test
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-go-test') }}
        run: go test ./...

      - name: Go build
        run: go build ./...

  web:
    name: Web Build & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npm run typecheck

      - name: Test
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npm run test:run

      - name: Build
        run: npm run build

  # The stdio MCP server in mcp/. Path-filtered on pull requests only, and
  # fail-open: it runs whenever the filter did not succeed, and on every
  # push/workflow_call. A skipped job reports as passed.
  mcp:
    name: MCP Build & Test
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.mcp == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Builds the runtime image and runs it the way the chart does: non-root,
  # read-only root filesystem with a /tmp tmpfs, no capabilities. Both
  # servers must answer, and a SIGTERM must stop both cleanly (exit 0) well
  # inside the kubelet's grace period. Path-filtered on pull requests only,
  # fail-open like the mcp job; a skipped job reports as passed.
  image:
    name: Image smoke test
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cluster-vision:smoke
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it as the chart does and stop it
        run: |
          set -eu
          docker run -d --name cv \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e CLUSTER_NAME=smoke -e PORT=3000 -e API_URL=http://localhost:8080 \
            -p 3000:3000 -p 8080:8080 \
            cluster-vision:smoke -port=8080 -refresh=5m

          fail() { echo "::error::$1"; docker logs cv; exit 1; }
          [ "$(docker exec cv id -u)" != 0 ] || fail "container runs as root"

          # No cluster here: the API boots with discovery disabled.
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health/live >/dev/null || fail "API never answered /api/health/live"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" != 000 ] && break
            sleep 1
          done
          [ "$code" != 000 ] || fail "web server never answered on :3000"
          echo "web answered HTTP $code"

          start=$(date +%s)
          docker stop -t 25 cv
          took=$(( $(date +%s) - start ))
          rc=$(docker inspect -f '{{.State.ExitCode}}' cv)
          docker logs cv 2>&1 | tail -20
          [ "$rc" = 0 ] || fail "exit code $rc after SIGTERM (want 0)"
          [ "$took" -lt 20 ] || fail "took ${took}s to stop; SIGTERM is not reaching both servers"
          echo "stopped cleanly in ${took}s"

  # Pull-based migration check (2026-09-22). The cluster does the work: this
  # job publishes the artifact and hands the check over. It builds the PR
  # image, pushes ghcr.io/fredericrous/cluster-vision:pr-<head sha> and adds
  # the `migration-check` label; homelab's Flux ResourceSetInputProvider lists
  # labelled PRs every 2 min and creates one MigrationCheck per PR, which
  # homelab-preview-operator runs (prod-data clone + this image's /api +
  # /api/config reporting eam:true) and reports back as the "Migration check
  # (prod-data clone)" check run on the head sha. No kubectl, no service
  # account, no cluster access here.
  #
  # The image is built from the PR merge ref that actions/checkout gives a
  # pull_request run, i.e. the change on top of main, and tagged with the head
  # sha the check run attaches to. NPM_TOKEN is needed for the web build's
  # private @fredericrous/* packages, exactly as the release build passes it.
  pr-image:
    name: PR image for the migration check
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      IMAGE: ghcr.io/fredericrous/cluster-vision:pr-${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hand the check to the cluster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label migration-check
          echo "pushed $IMAGE and labelled the PR; the cluster runs the check from here"
