name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Hosted runners for everything that does not need the cluster (2026-09-21).
# 90 days of ARC history: p90 queue wait 4-5 min on jobs whose p50 is 2-4 min,
# 48-minute outliers on runner-pool incidents. ubuntu-latest picks up in
# seconds with 4 vCPU; the public repo pays nothing for it. Only the
# migration check still needs an in-cluster runner (it creates a
# MigrationCheck with the pod's service account).
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'internal/store/migrations/**'
              - 'internal/store/db.go'

  go:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The linter version lives in the Makefile and nowhere else, so `make
      # lint` on a workstation and this step run the same binary. The action
      # is kept rather than calling `make lint` directly because
      # only-new-issues below is the action's doing — it diffs the push/PR and
      # passes --new-from-patch/--new-from-merge-base, which a plain
      # `golangci-lint run` cannot reproduce — and because it caches.
      - name: Resolve golangci-lint version
        id: golangci
        run: |
          version=$(awk '/^GOLANGCI_LINT_VERSION[[:space:]]*\?=/{print $NF}' Makefile)
          [ -n "$version" ] || { echo "::error::GOLANGCI_LINT_VERSION not found in Makefile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci.outputs.version }}
          only-new-issues: true

      - name: Go test
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-go-test') }}
        run: go test ./...

      - name: Go build
        run: go build ./...

  web:
    name: Web Build & Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attestation check
        id: attest
        uses: fredericrous/attest@v1
        with:
          platform: any

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates), 'pre-push-run-tests-js') }}
        run: npm run typecheck

      - name: Build
        run: npm run build

  migration-check:
    name: Migration check (prod-data clone)
    # Path-filtered like duro-app: 52 runs in 90 days caught 0 migration
    # regressions (its only failures were clone-provisioning flakes) while the
    # migrations changed 3 times in 180 days. Run it when they change.
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.migrations == 'true' }}
    runs-on: cluster-vision
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      MC_NS: migration-check
      MC_NAME: cv-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kubectl
        run: |
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure in-cluster kubeconfig (scoped SA)
        run: |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster k8s \
            --server="https://kubernetes.default.svc" \
            --certificate-authority="$SA/ca.crt" --embed-certs=true
          kubectl config set-credentials sa --token="$(cat $SA/token)"
          kubectl config set-context ctx --cluster=k8s --user=sa --namespace="$MC_NS"
          kubectl config use-context ctx

      - name: Request a prod-data clone (MigrationCheck)
        run: |
          cat <<YAML | kubectl apply -f -
          apiVersion: preview.homelab.io/v1
          kind: MigrationCheck
          metadata:
            name: ${MC_NAME}
            namespace: ${MC_NS}
          spec:
            appName: cluster-vision
            ttlSeconds: 1800
          YAML

      - name: Wait for clone to be Ready
        run: |
          # ~20m budget: covers clone scheduling delays under capacity
          # pressure (the ~10m budget was flaking whenever a clone queued).
          for i in $(seq 1 240); do
            phase=$(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "phase=$phase ($i)"
            case "$phase" in
              Ready)  exit 0 ;;
              Failed) echo "::error::MigrationCheck failed: $(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.message}')"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::clone did not become Ready in time"; exit 1

      - name: Read clone DATABASE_URL
        id: db
        run: |
          secret=$(kubectl -n "$MC_NS" get migrationcheck "$MC_NAME" -o jsonpath='{.status.connectionSecretName}')
          url=$(kubectl -n "$MC_NS" get secret "$secret" -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          echo "::add-mask::$url"
          echo "database_url=$url" >> "$GITHUB_OUTPUT"

      - name: Build the Go API
        run: go build -o cv-api ./cmd

      # Boot the Go API against the prod-data clone. The API owns the EAM
      # database: server.New -> store.New runs the embedded golang-migrate
      # migrations against DATABASE_URL before the HTTP server listens. When
      # that succeeds the DB pool is wired (s.db != nil), which /api/config
      # reports as {"eam":true} — so eam:true proves the migrations applied
      # cleanly against real data. (We gate on /api/config, not /api/health:
      # a migration failure is logged and leaves EAM disabled rather than
      # crashing, so /api/health would still 200; and /api/health also
      # requires live cluster discovery the scoped CI SA can't perform.)
      - name: Run migrations + serve against clone
        env:
          DATABASE_URL: ${{ steps.db.outputs.database_url }}
        run: |
          ./cv-api -port 8080 & SERVER_PID=$!
          ok=
          for i in $(seq 1 60); do   # generous: migrations run on first boot
            if curl -fsS http://localhost:8080/api/config | grep -q '"eam":true'; then ok=1; break; fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true
          [ -n "$ok" ] || { echo "::error::migrations failed against the prod-data clone (EAM did not come up)"; exit 1; }
          echo "migrations applied + EAM up against prod-data clone"

      - name: Tear down the clone
        if: always()
        run: kubectl -n "$MC_NS" delete migrationcheck "$MC_NAME" --ignore-not-found --wait=false
