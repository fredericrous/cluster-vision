apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-vision.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-vision.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cluster-vision.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-vision.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cluster-vision.serviceAccountName" . | quote }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The Go API is configured by flags (cmd/main.go), which the image
          # entrypoint hands to it; the web server reads PORT and API_URL.
          args:
            - {{ printf "-port=%d" (int .Values.api.port) | quote }}
            - {{ printf "-refresh=%s" (toString .Values.refresh) | quote }}
          env:
            - name: PORT
              value: {{ .Values.web.port | toString | quote }}
            - name: API_URL
              value: {{ printf "http://localhost:%d" (int .Values.api.port) | quote }}
            {{- if .Values.clusterName }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | toString | quote }}
            {{- end }}
            {{- if .Values.registryProxy }}
            - name: REGISTRY_PROXY
              value: {{ .Values.registryProxy | toString | quote }}
            {{- end }}
            {{- if .Values.dataSources }}
            - name: DATA_SOURCES
              value: {{ include "cluster-vision.dataSourcesJSON" . | quote }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          ports:
            - name: web
              containerPort: {{ .Values.web.port }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          # Liveness on /api/health/live (cheap, process-only) so a
          # transient DB outage drops the pod from Service endpoints via
          # readiness without also tripping liveness in a restart loop.
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - --timeout=5
                - http://localhost:{{ .Values.api.port }}/api/health/live
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - --timeout=5
                - http://localhost:{{ .Values.api.port }}/api/health
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.dataSources }}
          volumeMounts:
            {{- range $i, $ds := .Values.dataSources }}
            - name: source-{{ $i }}
              mountPath: /data/source-{{ $i }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if .Values.dataSources }}
      volumes:
        {{- range $i, $ds := .Values.dataSources }}
        - name: source-{{ $i }}
          secret:
            secretName: {{ $ds.secret.name | quote }}
            items:
              - key: {{ $ds.secret.key | quote }}
                path: data
        {{- end }}
      {{- end }}
