{{- if .Values.rbac.create -}}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) }}
{{- fail "serviceAccount.create=false needs serviceAccount.name: without it the cluster-wide read access would be bound to the namespace's `default` ServiceAccount. Name an existing ServiceAccount, or set rbac.create=false and grant access yourself." }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cluster-vision.fullname" . }}
  labels:
    {{- include "cluster-vision.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cluster-vision.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cluster-vision.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
